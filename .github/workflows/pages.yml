name: Публикация сайта на GitHub Pages

on:
  push:
    branches:
      - main
      - claude/serene-cerf-54bpfr
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Включить и настроить Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Главная = ranch.html (вариант A уезжает в variant-a.html)
        run: |
          mv index.html variant-a.html
          sed -i 's/href="index.html"/href="variant-a.html"/g' *.html
          cp ranch.html index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
